<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ① 改为你的文章标题 -->
    <title>【文章标题】| Ofyue</title>
    <meta name="description" content="【文章简介，约50字】">

    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/article.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>

<body class="article-body">

    <!-- Reading Progress -->
    <div id="reading-progress" aria-hidden="true"></div>

    <!-- SVG Filters -->
    <svg style="position:absolute;width:0;height:0;pointer-events:none;" aria-hidden="true">
        <defs>
            <filter id="brush-edge" x="-20%" y="-20%" width="140%" height="140%">
                <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
            </filter>
            <filter id="ink-spread-filter">
                <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="20" xChannelSelector="R"
                    yChannelSelector="G" />
                <feGaussianBlur stdDeviation="1" />
            </filter>
        </defs>
    </svg>

    <canvas id="ink-canvas" aria-hidden="true"></canvas>

    <!-- Breadcrumb Nav (fixed) -->
    <header class="article-breadcrumb" id="article-bc">
        <a href="../../list.html" class="breadcrumb-back">
            <span class="back-arrow">←</span> 所思所迹
        </a>
        <!-- ② 改为你的文章标题，显示在滚动后的顶部 -->
        <span class="breadcrumb-title">【文章标题】</span>
        <!-- ③ 改为你的分类，如：异想 / 词话 / 阅微 / 格物 -->
        <span class="breadcrumb-category">【分类】</span>
    </header>

    <!-- Article Container -->
    <article class="article-container">

        <!-- Article Header -->
        <header class="article-header">
            <!-- ④ 改为你的分类英文标签 -->
            <div class="article-category-badge">WHIMSY · 异想</div>

            <!-- ⑤ 文章主标题 -->
            <h1 class="article-title-main">【文章标题】</h1>

            <!-- ⑥ 副标题（可选，删除此行若无副标题） -->
            <p class="article-subtitle-main">【副标题或一句话描述】</p>

            <div class="article-meta-row">
                <!-- ⑦ 发布日期 -->
                <span>2026年&nbsp;月&nbsp;日</span>
                <span class="sep">·</span>
                <span>Ofyue</span>
                <span class="sep">·</span>
                <span>约 N 分钟阅读</span>
            </div>

            <div class="article-tags-row">
                <!-- ⑧ 标签（可增删） -->
                <span class="article-tag">标签一</span>
                <span class="article-tag">标签二</span>
            </div>

            <div class="article-header-rule">
                <div class="header-rule-seal"></div>
            </div>
        </header>

        <!-- ===== 正文区域 ===== -->
        <!-- 对于普通 Markdown 文章：在 article-content div 中直接写 HTML -->
        <!-- 对于继承自旧有 HTML 文章（如有 Tailwind）：使用 legacy-article-wrapper -->
        <div class="article-content">

            <p>【在此处写正文。可以直接使用 HTML 标签。】</p>

            <blockquote
                style="border-left:3px solid var(--ink-mid);padding-left:1.2rem;margin:1.5rem 0;color:var(--ink-mid);font-style:italic;">
                "引用文字写在这里"
                <footer style="font-size:0.85rem;margin-top:0.5rem;opacity:0.7;">—— 出处</footer>
            </blockquote>

            <h2 style="font-family:var(--font-kai);font-size:1.6rem;margin:2.5rem 0 1rem;letter-spacing:0.1em;">小节标题
            </h2>
            <p>内容……</p>

        </div>

        <!-- Article Footer Nav -->
        <nav class="article-nav">
            <a href="../../list.html" class="article-nav-btn">← 返回列表</a>
            <a href="../../index.html" class="article-nav-btn">回首页 →</a>
        </nav>

    </article>

    <!-- Back to Top -->
    <button class="back-to-top" id="back-to-top" aria-label="回到顶部"
        onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-quote"><span class="footer-quote-text">" 我 即 作 品 "</span></div>
            <div class="footer-links">
                <a href="../../index.html">草堂</a>
                <span class="footer-sep">·</span>
                <a href="../../list.html">文稿</a>
                <span class="footer-sep">·</span>
                <a href="https://github.com/aofenghanyue" target="_blank" rel="noopener">GitHub</a>
            </div>
            <p class="footer-copy">&copy; 2026 Ofyue. <span class="seal">ofyue印</span></p>
        </div>
    </footer>

    <script src="../../assets/js/script.js"></script>
    <script>
        // Breadcrumb scroll effect
        const bc = document.getElementById('article-bc');
        const btt = document.getElementById('back-to-top');
        window.addEventListener('scroll', () => {
            const scrolled = window.scrollY > 120;
            bc.classList.toggle('scrolled', scrolled);
            btt.classList.toggle('visible', scrolled);
        }, { passive: true });
    </script>
</body>

</html>
